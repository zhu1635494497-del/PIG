name: Unsigned Windows Release Candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc*"

permissions:
  contents: read

jobs:
  build-candidate:
    name: Build unsigned Windows x64 candidate
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install locked release environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r release\requirements-release.lock
          python -m pip install --no-deps -e .

      - name: Run automated tests
        shell: pwsh
        run: python -m pytest

      - name: Generate dependency evidence
        shell: pwsh
        run: |
          python tools\generate_release_metadata.py --output-dir release
          cyclonedx-py requirements release\requirements-runtime.txt --pyproject pyproject.toml --output-reproducible --of JSON -o release\pig-runtime.cdx.json
          pip-audit -r release\requirements-runtime.txt --format json --output release\pip-audit.json

      - name: Build onedir package
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist\workbench-w9 --workpath build\workbench-w9 packaging\PIG.spec

      - name: Run package smoke tests and write evidence
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\workbench-w9\PIG\PIG.exe"
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP "pig-workbench-acceptance"
          $runtime = Start-Process $exe -ArgumentList "--runtime-smoke-test" -WindowStyle Hidden -Wait -PassThru
          $flow = Start-Process $exe -ArgumentList @("--acceptance-smoke-test", $acceptanceRoot) -WindowStyle Hidden -Wait -PassThru
          if ($runtime.ExitCode -ne 0) { throw "Runtime smoke failed: $($runtime.ExitCode)" }
          if ($flow.ExitCode -ne 0) { throw "Packaged flow failed: $($flow.ExitCode)" }
          $version = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "manual" }
          $candidateRoot = "dist\release-candidate\PIG-$version-windows-x64-unsigned"
          New-Item -ItemType Directory -Path $candidateRoot -Force | Out-Null
          Get-ChildItem -LiteralPath "dist\workbench-w9\PIG" -Force | Copy-Item -Destination $candidateRoot -Recurse -Force
          Copy-Item README.md,LICENSE,NOTICE -Destination $candidateRoot
          Copy-Item release\THIRD_PARTY_NOTICES.md -Destination "$candidateRoot\THIRD_PARTY_NOTICES.md"
          Copy-Item release\pig-runtime.cdx.json -Destination "$candidateRoot\SBOM.json"
          Copy-Item release\pip-audit.json -Destination "$candidateRoot\VULNERABILITY-AUDIT.json"
          python tools\generate_release_metadata.py --output-dir release --distribution-dir $candidateRoot
          $report = Get-ChildItem -LiteralPath $acceptanceRoot -Recurse -Filter "workbench-acceptance-report.json" | Select-Object -First 1
          if ($null -eq $report) { throw "Packaged-flow report was not created" }
          python tools\generate_windows_build_report.py --acceptance-report $report.FullName --runtime-smoke-exit-code $runtime.ExitCode --packaged-flow-exit-code $flow.ExitCode

      - name: Package unsigned candidate
        id: package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "manual" }
          $archive = "PIG-$version-windows-x64-unsigned.zip"
          $checksum = "$archive.sha256"
          $candidateRoot = "dist\release-candidate\PIG-$version-windows-x64-unsigned"
          Compress-Archive -LiteralPath $candidateRoot -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File -LiteralPath $checksum -Encoding ascii
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum=$checksum" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload unsigned internal candidate
        uses: actions/upload-artifact@v4
        with:
          name: pig-windows-x64-unsigned-internal-rc
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            release/windows-build-report.json
            release/windows-file-inventory.json
            release/pig-runtime.cdx.json
            release/pip-audit.json
            release/THIRD_PARTY_NOTICES.md
            release/THIRD_PARTY_NOTICES.json
            release/WORKBENCH-W9-RELEASE-CHECKLIST.md
