[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pig-project-ingestion-gateway"
version = "1.0.0rc1"
description = "A project workbench for complex nested business files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "extract-msg>=0.56,<0.57",
    "py7zr>=1.1.3,<1.2",
    "PySide6-Essentials>=6.8,<6.11",
]

[project.scripts]
pig-desktop = "pig.ui.app:main"

[project.urls]
Homepage = "https://github.com/zhu1635494497-del/PIG-Project-Ingestion-Gateway"
Repository = "https://github.com/zhu1635494497-del/PIG-Project-Ingestion-Gateway.git"
Issues = "https://github.com/zhu1635494497-del/PIG-Project-Ingestion-Gateway/issues"
Releases = "https://github.com/zhu1635494497-del/PIG-Project-Ingestion-Gateway/releases"

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]
release = [
    "PyInstaller>=6.22,<6.23",
    "pyinstaller-hooks-contrib>=2026.3,<2027",
    "pip-tools>=7.6,<7.7",
    "cyclonedx-bom>=7.3,<8",
    "pip-audit>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
